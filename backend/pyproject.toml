[project]
name = "fieldmaps-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.135,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "pydantic>=2.12,<3",
  "pyjwt[crypto]>=2.10,<3",
  "orjson>=3.10,<4",
  "anyio>=4.9,<5",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["basedpyright>=1.28", "ruff>=0.11", "pytest>=8", "httpx2[http2,brotli,zstd]>=2"]

[tool.basedpyright]
typeCheckingMode = "all"
pythonVersion = "3.13"
include = ["src", "tests"]
reportUnusedCallResult = "none"
reportImplicitStringConcatenation = "none"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "ISC001", "D203", "D213", "D100", "D101", "D102", "D103", "D104", "D105", "D107", "CPY001", "RET504"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG", "PLR2004", "INP001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["integration: requires the local FieldMaps Supabase stack"]

[tool.uv]
package = false
